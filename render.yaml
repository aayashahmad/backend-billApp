# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Leave the "Blueprint Path" field EMPTY in the Render UI: this file sits at
# the repository root, which is where Render looks by default.

databases:
  - name: billing-db
    databaseName: billing
    user: billing
    plan: free

services:
  - type: web
    name: billing-api
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: pip install -r requirements.txt

    # Migrations run here, not in buildCommand: the build step has no access
    # to the database, and `create_all` in app/main.py only creates missing
    # tables — it never adds a column to a table that already exists. Without
    # this, any schema change silently leaves production on the old shape and
    # the first query touching the new column 500s.
    #
    # `&&` is load-bearing: a failed migration must abort the start so the
    # deploy fails loudly, rather than serving traffic on a half-applied
    # schema. Migrations are idempotent, so this is a no-op once applied.
    #
    # Render injects $PORT; binding anywhere else makes the deploy time out.
    startCommand: python -m migrations.run_all && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Marks a deploy live only once Postgres actually answers, so a broken
    # database connection fails the deploy instead of serving 500s.
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billing-db
          property: connectionString

      # Signs the JWTs. Generated once by Render and never in the repo.
      # Changing it invalidates every issued token.
      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.11.9"

      # Password-reset email. Brevo's HTTP API is used rather than SMTP
      # because Render's free plan blocks outbound traffic on every SMTP
      # port (25/465/587) — an SMTP mailer works locally and then fails
      # here. Set both in the Render dashboard; MAIL_FROM must be an
      # address verified as a sender in the Brevo account.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # NOTE: the free plan has an ephemeral filesystem — uploaded payment
      # screenshots are deleted on every deploy and restart. See README for
      # the persistent-disk and object-storage options.
      - key: UPLOADS_DIR
        value: uploads
